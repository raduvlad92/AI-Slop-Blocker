name: Validate blocklist JSON

on:
  pull_request:
    paths:
      - "blocklist/*.json"
  push:
    branches: [main]
    paths:
      - "blocklist/*.json"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate structure
        run: node .github/validate-blocklist.js
